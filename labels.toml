# SPDX-License-Identifier: Apache-2.0
# The labels every OPEN repository shares. A repository may add its own
# labels (such as area: labels) but must not redefine one of these.
#
# To change this set, open a pull request against this file. After it
# merges, an organization owner runs `python3 scripts/sync_labels.py` (a dry
# run) and then `python3 scripts/sync_labels.py --apply`.
#
# Each label has a name, a color (six hex digits, no #), a description (at
# most 100 characters), and aliases: old names that the sync renames to, or
# merges into, this label. Names and aliases are ASCII, at most 50
# characters, with no commas and no spaces at either end.
#
# To rename a label, change its name and add the old name to its aliases.
# Without the alias, the sync creates the new label and leaves the old one.
# Removing a label from this file changes nothing in the repositories: the
# sync never deletes a label that is not listed here.

# Type

[[label]]
name = "bug"
color = "d73a4a"
description = "Something isn't working"
aliases = []

[[label]]
name = "enhancement"
color = "a2eeef"
