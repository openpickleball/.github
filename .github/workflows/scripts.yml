# SPDX-License-Identifier: Apache-2.0
# Tests the Python scripts in scripts/: the pull request checks other
# repositories run, and the label sync an organization owner runs locally.
name: Scripts

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 -I scripts/test_check_pull_request.py
      - run: python3 -I scripts/test_sync_labels.py
